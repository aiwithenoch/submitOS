<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanSubmit - Create Account</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <header class="auth-header">
        <div class="logo-container">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4V20M4 12h16" stroke="#00357B" stroke-width="2" stroke-linecap="round"/>
                <circle cx="12" cy="12" r="10" stroke="#00357B" stroke-width="2" stroke-dasharray="2 4"/>
            </svg>
            <span class="logo-text">CleanSubmit</span>
        </div>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <h1>Create your account</h1>
            <p class="auth-subtitle">Create an account to upload papers and receive official similarity results.</p>
            
            <form action="dashboard.html" method="GET" class="auth-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Jane Doe" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="you@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 8 characters" required>
                </div>
                
                <p class="auth-hint">We'll email you a 6-digit code to confirm your address.</p>
                
                <button type="submit" class="btn-primary full-width" style="padding: 12px; font-size: 14px; margin-top: 8px;">Create account</button>
            </form>
            
            <p class="auth-terms">By creating an account, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
        </div>
        <p class="auth-footer">Already have an account? <a href="index.html">Sign in</a></p>
    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-forms.js"></script>
</body>
</html>
