<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanSubmit - Sign In</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <header class="auth-header">
        <div class="logo-container">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4V20M4 12h16" stroke="#00357B" stroke-width="2" stroke-linecap="round"/>
                <circle cx="12" cy="12" r="10" stroke="#00357B" stroke-width="2" stroke-dasharray="2 4"/>
            </svg>
            <span class="logo-text">CleanSubmit</span>
        </div>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <h1>Sign in</h1>
            <p class="auth-subtitle">Welcome back. Sign in to upload papers and download your reports.</p>
            
            <form action="dashboard.html" method="GET" class="auth-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="you@email.com" required>
                </div>
                
                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-primary full-width" style="padding: 12px; font-size: 14px; margin-top: 8px;">Sign In</button>
            </form>
        </div>
        <p class="auth-footer">New to CleanSubmit? <a href="register.html">Create an account</a></p>
    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-forms.js"></script>
</body>
</html>
